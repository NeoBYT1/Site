<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Roleplay</title>
    <!-- ↓↓↓ CONFIGURAÇÕES ↓↓↓ -->
    <script>
        const LINK_DESTINO = "https://seu-novo-site-aqui.com";
        const TEMPO_ESPERA = 5; // segundos
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background: linear-gradient(135deg, #050505, #1a0000);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1{
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(90deg, #FF0033, #ff6688);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .aviso{font-size: 1.2rem; color: #ddd; margin-bottom: 25px;}
        .contador{font-size: 3.5rem; font-weight: bold; color: #FFC107; margin: 20px 0;}
        .botao{
            background: #FF0033;
            color: white;
            padding: 14px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .botao:hover{background: #cc0029; transform: scale(1.05);}
    </style>
</head>
<body>

    <h1>CENTRAL ROLEPLAY</h1>
    <p class="aviso">Você está sendo redirecionado para a nossa página oficial...</p>

    <div class="contador" id="contador"></div>

    <a class="botao" id="btnIr" href="">👉 Clique aqui se não quiser esperar</a>

    <script>
        document.getElementById("btnIr").href = LINK_DESTINO;
        let tempo = TEMPO_ESPERA;
        document.getElementById("contador").innerText = tempo + "s";

        const cronometro = setInterval(()=>{
            tempo--;
            document.getElementById("contador").innerText = tempo + "s";
            if(tempo <= 0){
                clearInterval(cronometro);
                window.location.href = LINK_DESTINO;
            }
        }, 1000);
    </script>

</body>
</html>
